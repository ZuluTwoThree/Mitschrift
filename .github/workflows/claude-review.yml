name: Claude Code Review

on:
  issue_comment:
    types: [created]

jobs:
  review:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_REVIEW }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          claude_args: "--allowedTools Bash(git:*),Bash(gh:*),Read,Grep,Glob,Agent,Skill,TodoWrite"
          prompt: "Lies zuerst die Datei review.md im Wurzelverzeichnis des Repositorys und wende ihre Regeln (Haltung, Schweregrade, Prüfschwerpunkte, Format, deutsche Sprache) an. Dann: /code-review:code-review https://github.com/${{ github.repository }}/pull/${{ github.event.issue.number }} . Poste dein Ergebnis am Ende in jedem Fall als Kommentar auf den Pull Request mit `gh pr comment ${{ github.event.issue.number }} --body-file <datei>`, auch wenn du keine Befunde hast (dann kurz: keine relevanten Befunde, was geprüft wurde). Gib das Ergebnis nicht nur als Antworttext zurück."
