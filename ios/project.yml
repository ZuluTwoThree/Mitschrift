# XcodeGen-Definition der iOS-App. Erzeugen mit: zsh Scripts/build-ios.sh (oder `cd ios && xcodegen`).
# Das erzeugte Mitschrift.xcodeproj ist gitignoriert.
name: Mitschrift
options:
  bundleIdPrefix: io.github.zulutwothree
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

packages:
  MitschriftCore:
    path: ..

targets:
  Mitschrift-iOS:
    type: application
    platform: iOS
    sources:
      - path: ../Sources/MitschriftIOS
      - path: Assets.xcassets
    dependencies:
      - package: MitschriftCore
        product: MitschriftCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Mitschrift
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "Mitschrift benötigt das Mikrofon, um Gespräche aufzuzeichnen. Audio wird nur an deinen eigenen Server im privaten Tailnet gesendet."
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zulutwothree.mitschrift.ios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: true
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
